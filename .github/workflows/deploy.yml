name: "Deploy — Build, Upload & Auto-Scale"

# ─────────────────────────────────────────────────────────────────────────────
# ZERO-SETUP DEPLOYMENT:
# Just add these 2 GitHub Secrets:
#   AWS_ACCESS_KEY_ID      → your IAM access key
#   AWS_SECRET_ACCESS_KEY  → your IAM secret key
#
# Everything else (S3 buckets, DynamoDB, VPC, ALB, ASG) is auto-provisioned!
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Git SHA to roll back to (leave empty for fresh deploy)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

# Never run two deployments at once: Terraform state locks and ASG instance
# refreshes collide when two pushes land close together.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: "Build & Upload Artifact to S3"
    runs-on: ubuntu-latest
    outputs:
      artifact_version: ${{ steps.version.outputs.sha }}
      aws_region: ${{ steps.setup_env.outputs.aws_region }}
      state_bucket: ${{ steps.setup_env.outputs.state_bucket }}
      state_key: ${{ steps.setup_env.outputs.state_key }}
      lock_table: ${{ steps.setup_env.outputs.lock_table }}
      artifact_bucket: ${{ steps.setup_env.outputs.artifact_bucket }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine artifact version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.rollback_version }}" ]; then
            echo "sha=${{ github.event.inputs.rollback_version }}" >> "$GITHUB_OUTPUT"
            echo "⏪ Rollback to ${{ github.event.inputs.rollback_version }}"
          else
            SHA=$(echo "${{ github.sha }}" | cut -c1-8)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "🚀 Deploying $SHA"
          fi

      # ── Auth ────────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials (Static Keys)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'us-east-1' }}

      # ── Auto-bootstrap Backend & Artifact Buckets ───────────────────────────
      - name: Auto-bootstrap S3 Buckets & DynamoDB
        id: setup_env
        run: |
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          STATE_BUCKET="${{ vars.TF_STATE_BUCKET }}"
          if [ -z "$STATE_BUCKET" ]; then
            STATE_BUCKET="scaleops-tf-state-${ACCOUNT_ID}"
          fi

          ARTIFACT_BUCKET="${{ vars.DEPLOY_ARTIFACT_BUCKET }}"
          if [ -z "$ARTIFACT_BUCKET" ]; then
            ARTIFACT_BUCKET="scaleops-artifacts-${ACCOUNT_ID}"
          fi

          LOCK_TABLE="${{ vars.TF_STATE_LOCK_TABLE || 'scaleops-tf-locks' }}"
          STATE_KEY="${{ vars.TF_STATE_KEY || 'scaleops-demo/terraform.tfstate' }}"

          echo "aws_region=$REGION" >> "$GITHUB_OUTPUT"
          echo "state_bucket=$STATE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"
          echo "lock_table=$LOCK_TABLE" >> "$GITHUB_OUTPUT"
          echo "artifact_bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"

          # 1. Ensure State Bucket exists
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Creating state bucket $STATE_BUCKET in $REGION..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

          # 2. Ensure DynamoDB table exists
          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$REGION" >/dev/null 2>&1; then
            echo "Creating lock table $LOCK_TABLE..."
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
          fi

          # 3. Ensure Artifact Bucket exists
          if ! aws s3api head-bucket --bucket "$ARTIFACT_BUCKET" 2>/dev/null; then
            echo "Creating artifact bucket $ARTIFACT_BUCKET in $REGION..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$ARTIFACT_BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$ARTIFACT_BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$ARTIFACT_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$ARTIFACT_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$ARTIFACT_BUCKET" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

      - name: Check if artifact already exists in S3
        id: check
        run: |
          SHA="${{ steps.version.outputs.sha }}"
          ARTIFACT_BUCKET="${{ steps.setup_env.outputs.artifact_bucket }}"
          KEY="releases/$SHA/scaleops-demo-$SHA.tar.gz"
          if aws s3 ls "s3://$ARTIFACT_BUCKET/$KEY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Artifact $SHA already in S3 — skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build Next.js standalone
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Package release artifact
        if: steps.check.outputs.exists == 'false'
        run: bash scripts/package-release.sh "${{ steps.version.outputs.sha }}"

      - name: Upload artifact to S3
        if: steps.check.outputs.exists == 'false'
        run: |
          SHA="${{ steps.version.outputs.sha }}"
          ARTIFACT_BUCKET="${{ steps.setup_env.outputs.artifact_bucket }}"
          REGION="${{ steps.setup_env.outputs.aws_region }}"
          aws s3 cp \
            "/tmp/scaleops-release/scaleops-demo-$SHA.tar.gz" \
            "s3://$ARTIFACT_BUCKET/releases/$SHA/scaleops-demo-$SHA.tar.gz" \
            --region "$REGION"
          echo "✅ Uploaded: s3://$ARTIFACT_BUCKET/releases/$SHA/"

  deploy:
    name: "Provision / Update Infrastructure & Roll Out"
    needs: build-and-upload
    runs-on: ubuntu-latest
    outputs:
      alb_dns: ${{ steps.tf_out.outputs.alb_dns }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:     ${{ needs.build-and-upload.outputs.aws_region }}

      - name: Configure AWS credentials (Static Keys)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ needs.build-and-upload.outputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: true

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.build-and-upload.outputs.state_bucket }}" \
            -backend-config="key=${{ needs.build-and-upload.outputs.state_key }}" \
            -backend-config="region=${{ needs.build-and-upload.outputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ needs.build-and-upload.outputs.lock_table }}"

      - name: Terraform Apply (Auto-Deploy Infrastructure)
        run: |
          terraform apply -auto-approve \
            -var="deploy_artifact_bucket=${{ needs.build-and-upload.outputs.artifact_bucket }}" \
            -var="artifact_version=${{ needs.build-and-upload.outputs.artifact_version }}" \
            -var="aws_region=${{ needs.build-and-upload.outputs.aws_region }}"

      - name: Capture Terraform outputs
        id: tf_out
        run: |
          echo "asg_name=$(terraform output -raw asg_name)"      >> "$GITHUB_OUTPUT"
          echo "alb_dns=$(terraform output -raw alb_dns_name)"   >> "$GITHUB_OUTPUT"

      - name: Start ASG Instance Refresh (Rolling Update)
        id: refresh
        run: |
          ASG="${{ steps.tf_out.outputs.asg_name }}"
          REGION="${{ needs.build-and-upload.outputs.aws_region }}"
          # Check if a refresh is already in progress
          IN_PROGRESS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG" \
            --region "$REGION" \
            --query "InstanceRefreshes[?Status=='InProgress'].InstanceRefreshId" \
            --output text 2>/dev/null || echo "")
          if [ -n "$IN_PROGRESS" ]; then
            echo "🔄 Refresh already in progress: $IN_PROGRESS"
            echo "refresh_id=$IN_PROGRESS" >> "$GITHUB_OUTPUT"
          else
            REFRESH_ID=$(aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$ASG" \
              --strategy Rolling \
              --preferences "MinHealthyPercentage=50,InstanceWarmup=180,SkipMatching=true" \
              --query "InstanceRefreshId" \
              --output text \
              --region "$REGION")
            echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
            echo "🔄 Started instance refresh: $REFRESH_ID"
          fi

      - name: Wait for Instance Refresh to complete
        run: |
          ASG="${{ steps.tf_out.outputs.asg_name }}"
          REGION="${{ needs.build-and-upload.outputs.aws_region }}"
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          echo "Waiting for refresh $REFRESH_ID to complete..."
          DONE=false
          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG" \
              --region "$REGION" \
              --query "InstanceRefreshes[?InstanceRefreshId=='$REFRESH_ID'].Status" \
              --output text 2>/dev/null || echo "Unknown")
            echo "Attempt $i/30: refresh status = $STATUS"
            if [ "$STATUS" = "Successful" ]; then
              echo "✅ Instance refresh completed successfully!"
              DONE=true
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Instance refresh $STATUS"
              exit 1
            fi
            sleep 30
          done
          if [ "$DONE" != "true" ]; then
            echo "❌ Instance refresh did not finish within 15 minutes"
            echo "--- refresh status ---"
            aws autoscaling describe-instance-refreshes --auto-scaling-group-name "$ASG" --region "$REGION" \
              --query "InstanceRefreshes[0].[Status,StatusReason,PercentageComplete]" --output text || true
            echo "--- recent scaling activities ---"
            aws autoscaling describe-scaling-activities --auto-scaling-group-name "$ASG" --region "$REGION" --max-items 8 \
              --query "Activities[].[StatusCode,Description,Cause]" --output text || true
            echo "--- target health ---"
            TG=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG" --region "$REGION" \
              --query "AutoScalingGroups[0].TargetGroupARNs[0]" --output text || true)
            aws elbv2 describe-target-health --target-group-arn "$TG" --region "$REGION" \
              --query "TargetHealthDescriptions[].[Target.Id,TargetHealth.State,TargetHealth.Reason,TargetHealth.Description]" --output text || true
            exit 1
          fi

  verify:
    name: "Verify Deployment"
    needs: [build-and-upload, deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Static Keys)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ needs.build-and-upload.outputs.aws_region }}

      - name: Wait for ALB health check to pass
        run: |
          # Terraform's alb_dns_name output already includes the "http://" scheme.
          ALB_URL="${{ needs.deploy.outputs.alb_dns }}"
          case "$ALB_URL" in http://*|https://*) ;; *) ALB_URL="http://$ALB_URL" ;; esac
          echo "Waiting for $ALB_URL/api/health ..."
          HTTP_CODE="000"
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "$ALB_URL/api/health" || true)
            echo "Attempt $i/20: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ App is healthy!"
              break
            fi
            sleep 15
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ App did not respond with 200 after 5 minutes. Last code: $HTTP_CODE"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          ALB_URL="${{ needs.deploy.outputs.alb_dns }}"
          case "$ALB_URL" in http://*|https://*) ;; *) ALB_URL="http://$ALB_URL" ;; esac
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.build-and-upload.outputs.artifact_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ALB URL** | [$ALB_URL]($ALB_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health** | [$ALB_URL/api/health]($ALB_URL/api/health) |" >> $GITHUB_STEP_SUMMARY