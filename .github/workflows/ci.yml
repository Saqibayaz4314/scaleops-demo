name: "CI — Lint, Test & Build"

on:
  # master/main pushes are validated by the Deploy workflow (it builds the same
  # artifact), so CI is skipped there to avoid running everything twice.
  push:
    branches-ignore: ["main", "master"]
  pull_request:
    branches: ["main", "master", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: "Next.js — Lint, Type-check & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Verify standalone output exists
        run: |
          test -f .next/standalone/server.js && echo "✅ standalone/server.js present"
          test -d .next/static && echo "✅ .next/static present"

  terraform:
    name: "Terraform — Format & Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (local backend for validation only)
        run: terraform init -backend=false -upgrade

      - name: Terraform Validate
        run: |
          terraform validate -var="deploy_artifact_bucket=ci-validation" -var="artifact_version=ci-00000000"

  scripts:
    name: "Shell Scripts — Syntax Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check script syntax
        run: |
          bash -n scripts/package-release.sh
          bash -n scripts/verify-deployment.sh
          bash -n scripts/bootstrap-aws.sh
          echo "✅ All shell scripts pass syntax check"