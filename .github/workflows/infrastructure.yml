name: "Infrastructure — Terraform Plan & Apply"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      artifact_version:
        description: "Git SHA of the artifact (optional)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: "Terraform ${{ github.event.inputs.action }}"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Auth ────────────────────────────────────────────────────────────────
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure AWS credentials (Static Keys)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'us-east-1' }}

      # ── Auto-bootstrap ──────────────────────────────────────────────────────
      - name: Auto-bootstrap S3 Buckets & DynamoDB
        id: setup_env
        run: |
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          STATE_BUCKET="${{ vars.TF_STATE_BUCKET }}"
          [ -z "$STATE_BUCKET" ] && STATE_BUCKET="scaleops-tf-state-${ACCOUNT_ID}"

          ARTIFACT_BUCKET="${{ vars.DEPLOY_ARTIFACT_BUCKET }}"
          [ -z "$ARTIFACT_BUCKET" ] && ARTIFACT_BUCKET="scaleops-artifacts-${ACCOUNT_ID}"

          LOCK_TABLE="${{ vars.TF_STATE_LOCK_TABLE || 'scaleops-tf-locks' }}"
          STATE_KEY="${{ vars.TF_STATE_KEY || 'scaleops-demo/terraform.tfstate' }}"

          echo "aws_region=$REGION" >> "$GITHUB_OUTPUT"
          echo "state_bucket=$STATE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "state_key=$STATE_KEY" >> "$GITHUB_OUTPUT"
          echo "lock_table=$LOCK_TABLE" >> "$GITHUB_OUTPUT"
          echo "artifact_bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$REGION" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
          fi

          if ! aws s3api head-bucket --bucket "$ARTIFACT_BUCKET" 2>/dev/null; then
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$ARTIFACT_BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$ARTIFACT_BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$ARTIFACT_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$ARTIFACT_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$ARTIFACT_BUCKET" \
              --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.setup_env.outputs.state_bucket }}" \
            -backend-config="key=${{ steps.setup_env.outputs.state_key }}" \
            -backend-config="region=${{ steps.setup_env.outputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=${{ steps.setup_env.outputs.lock_table }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Action
        run: |
          ARTIFACT_VER="${{ github.event.inputs.artifact_version || 'initial' }}"
          ACTION="${{ github.event.inputs.action }}"

          if [ "$ACTION" = "plan" ]; then
            terraform plan \
              -var="deploy_artifact_bucket=${{ steps.setup_env.outputs.artifact_bucket }}" \
              -var="artifact_version=$ARTIFACT_VER" \
              -var="aws_region=${{ steps.setup_env.outputs.aws_region }}"
          elif [ "$ACTION" = "apply" ]; then
            terraform apply -auto-approve \
              -var="deploy_artifact_bucket=${{ steps.setup_env.outputs.artifact_bucket }}" \
              -var="artifact_version=$ARTIFACT_VER" \
              -var="aws_region=${{ steps.setup_env.outputs.aws_region }}"
          elif [ "$ACTION" = "destroy" ]; then
            terraform destroy -auto-approve \
              -var="deploy_artifact_bucket=${{ steps.setup_env.outputs.artifact_bucket }}" \
              -var="artifact_version=$ARTIFACT_VER" \
              -var="aws_region=${{ steps.setup_env.outputs.aws_region }}"
          fi
